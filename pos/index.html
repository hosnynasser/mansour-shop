<style>
html,body{margin:0;background:#0d1f38}
.splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;color:#fff;font-family:"Cairo",system-ui,sans-serif;background:radial-gradient(120% 70% at 50% 38%,#1d4673 0%,#10284a 45%,#091426 100%);overflow:hidden;z-index:9999}
.splash:before{content:"";position:absolute;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,rgba(242,184,75,.28),rgba(242,184,75,0) 68%);top:calc(38% - 210px);left:calc(50% - 210px);animation:spGlow 2.6s ease-in-out infinite}
.splash .lg{position:relative;width:min(58vw,240px);height:min(58vw,240px);border-radius:50%;box-shadow:0 18px 50px rgba(0,0,0,.45);animation:spIn .7s cubic-bezier(.2,.8,.2,1) both}
.splash h1{position:relative;margin:34px 0 0;font-size:44px;font-weight:800;letter-spacing:.5px;animation:spUp .7s .15s both}
.splash .en{position:relative;margin-top:2px;font-size:13px;font-weight:700;letter-spacing:7px;color:#f2b84b;padding-inline-start:7px;animation:spUp .7s .25s both}
.splash .bar{position:absolute;bottom:max(64px,env(safe-area-inset-bottom));width:96px;height:4px;border-radius:4px;background:rgba(255,255,255,.14);overflow:hidden}
.splash .bar i{display:block;height:100%;width:40%;border-radius:4px;background:#f2b84b;animation:spBar 1.2s ease-in-out infinite}
@keyframes spIn{from{opacity:0;transform:scale(.86)}to{opacity:1;transform:none}}
@keyframes spUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes spGlow{0%,100%{opacity:.7;transform:scale(1)}50%{opacity:1;transform:scale(1.08)}}
@keyframes spBar{0%{transform:translateX(-120%)}100%{transform:translateX(260%)}}
</style>
<title>منصور | MANSOUR POS</title>
</head>
<body><div id="root"><div class="splash"><img class="lg" src="/src/photos/logo-mansour.png" alt=""><h1>منصور</h1><div class="en">MANSOUR POS</div><div class="bar"><i></i></div></div></div><script type="module" src="/src-pos/main.tsx"></script></body>
</html>
